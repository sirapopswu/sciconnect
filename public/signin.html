<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SciConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-bg">
    <div class="auth-container">
        <div class="auth-card">
            <!-- Left Side: Branding -->
            <div class="auth-left">
                <div class="auth-brand">
                    <span class="auth-icon"><svg class="sci-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(45 12 12)"></ellipse><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-45 12 12)"></ellipse></svg></span>
                    <h1>Sci<span>Connect</span></h1>
                    <p>"เชื่อมต่อชาววิทย์ ชิดใกล้กว่าที่เคย"</p>
                </div>
                <a href="home.html" class="back-home">← กลับหน้าหลัก</a>
            </div>
            
            <!-- Right Side: Form -->
            <div class="auth-right">
                <div class="auth-form-container">
                    <h2>WELCOME TO<br><span class="highlight-text">Sci Connect</span></h2>
                    
                    <form id="signinForm" class="auth-form">
                        <div class="input-group">
                            <label for="email">อีเมล (Email / Gmail)</label>
                            <input type="email" id="email" placeholder="example@gmail.com" required>
                        </div>
                        
                        <div class="input-group">
                            <label for="password">รหัสผ่าน (Password)</label>
                            <div class="password-wrapper">
                                <input type="password" id="password" placeholder="••••••••" required>
                                <button type="button" class="password-toggle" data-target="password" aria-label="แสดงรหัสผ่าน">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                                </button>
                            </div>
                        </div>
                        
                        <div class="auth-actions">
                            <button type="submit" class="auth-btn-signin">SIGN IN</button>
                            <a href="signup.html" class="auth-btn-signup">SIGN UP</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.getElementById('signinForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
            await showAlert('กรุณากรอกอีเมลและรหัสผ่านให้ครบ', 'warn');
            return;
        }

        try {
            // ส่ง request ไป backend /api/users/login
            const res = await fetch('http://localhost:3000/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (res.ok) {
                // บันทึกข้อมูล user ลง localStorage
                localStorage.setItem('user', JSON.stringify(data.user || { role: data.role }));

                // ใช้ studentid แทน username ซึ่งตอนสมัครถูกแมปไปที่ username
                const displayId = data.user ? (data.user.username || data.user.id) : data.role;
                await showAlert(`ยินดีต้อนรับ นิสิตรหัส ${displayId}`, 'success', 'เข้าสู่ระบบสำเร็จ');
                window.location.href = 'home.html';
            } else {
                await showAlert(data.message || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', 'error', 'เกิดข้อผิดพลาด');
            }
        } catch (err) {
            console.error(err);
            await showAlert('เกิดข้อผิดพลาดในการเชื่อมต่อ server', 'error');
        }
    });
    </script>
    <script src="app.js"></script>
</body>
</html>
