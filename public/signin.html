<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SciConnect</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-bg">
    <div class="auth-container">
        <div class="auth-card">
            <!-- Left Side: Branding -->
            <div class="auth-left">
                <div class="auth-brand">
                    <span class="auth-icon">⚛️</span>
                    <h1>Sci<span>Connect</span></h1>
                    <p>"เชื่อมต่อชาววิทย์ ชิดใกล้กว่าที่เคย"</p>
                </div>
                <a href="home.html" class="back-home">← กลับหน้าหลัก</a>
            </div>
            
            <!-- Right Side: Form -->
            <div class="auth-right">
                <div class="auth-form-container">
                    <h2>WELCOME TO<br><span class="highlight-text">Sci Connect</span></h2>
                    
                    <form action="home.html" class="auth-form">
                        <div class="input-group">
                            <label for="studentid">รหัสนิสิต (Student ID)</label>
                            <input type="text" id="studentid" placeholder="รหัสนิสิต 11 หลัก" required>
                        </div>
                        
                        <div class="input-group">
                            <label for="password">รหัสผ่าน (Password)</label>
                            <input type="password" id="password" placeholder="••••••••" required>
                        </div>
                        
                        <div class="auth-actions">
                            <button type="submit" class="auth-btn-signin">SIGN IN</button>
                            <!-- Note: Link should eventually go to signup.html -->
                            <a href="signup.html" class="auth-btn-signup">SIGN UP</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
