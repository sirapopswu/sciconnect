<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Major - SciConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="home.html" class="logo">
                <span class="logo-icon">⚛️</span>
                <span class="logo-text">Sci<span class="logo-highlight">Connect</span></span>
            </a>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="major.html" class="active">Major</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
            <div class="nav-action">
                <a href="signin.html" class="btn-signin">Sign in</a>
            </div>
            <button class="mobile-menu-btn" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <div class="members-header">
            <h2 class="members-title">สาขาวิชา (MAJORS)</h2>
            <p style="text-align:center; color:#64748b; margin-top:0.5rem; font-size:1.1rem;">เลือกสาขาวิชาเพื่อค้นหาเพื่อนใหม่!</p>
        </div>

        <!-- Search Table Section -->
        <section class="search-section" style="padding: 1rem 0; background: #f8fafc; margin-bottom: 2rem;">
            <div class="search-container" style="max-width: 1200px; margin: 0 auto; padding: 1.5rem; background: white; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; justify-content: center;">
                <div class="search-group" style="flex: 1; min-width: 200px;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #475569;">ค้นหา (Keyword)</label>
                    <input type="text" id="searchKeyword" placeholder="ชื่อ หรือ Bio..." style="width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px;">
                </div>
                <div class="search-group" style="flex: 1; min-width: 150px;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #475569;">สาขา (Major)</label>
                    <select id="searchMajor" style="width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px;">
                        <option value="">ทั้งหมด</option>
                        <option value="cs">Com-Sci</option>
                        <option value="math">Math-Stat</option>
                        <option value="bio">Biology</option>
                        <option value="chem">Chemistry</option>
                        <option value="gen">Gen-Sci</option>
                        <option value="mat">Mat-Sci</option>
                        <option value="micro">Micro-Bio</option>
                        <option value="phy">Physics</option>
                    </select>
                </div>
                <div class="search-group" style="flex: 1; min-width: 120px;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #475569;">เพศ (Gender)</label>
                    <select id="searchGender" style="width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px;">
                        <option value="">ทั้งหมด</option>
                        <option value="ชาย">ชาย</option>
                        <option value="หญิง">หญิง</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>
                <div class="search-group" style="flex: 1; min-width: 100px;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #475569;">รุ่น (Gen)</label>
                    <input type="text" id="searchGen" placeholder="เช่น 68" style="width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px;">
                </div>
                <div class="search-group" style="flex: 1; min-width: 100px;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #475569;">อายุ (Age)</label>
                    <input type="number" id="searchAge" placeholder="อายุ" style="width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px;">
                </div>
                <button id="btnSearch" style="padding: 0.75rem 2rem; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s;">ค้นหา</button>
            </div>
            
            <!-- Result Area -->
            <div id="searchResults" class="members-grid" style="max-width: 1200px; margin: 2rem auto; display: none;">
                <!-- Result cards will be injected here -->
            </div>
        </section>
        
        <section class="branches-section">
            <div class="branches-grid">
                <!-- Computer Science -->
                <a href="comsci.html" class="branch-card cs">
                    <span class="branch-name">COMPUTER<br>SCIENCE</span>
                </a>
                
                <!-- Math-Stat -->
                <a href="mathstat.html" class="branch-card math">
                    <span class="branch-name">MATH-STAT</span>
                </a>
                
                <!-- Biology -->
                <a href="bio.html" class="branch-card bio">
                    <span class="branch-name">BIOLOGY</span>
                </a>
                
                <!-- Chemistry -->
                <a href="chem.html" class="branch-card chem">
                    <span class="branch-name">CHEMISTRY</span>
                </a>
                
                <!-- General Science -->
                <a href="gensci.html" class="branch-card gen">
                    <span class="branch-name">GENERAL<br>SCIENCE</span>
                </a>
                
                <!-- Material Science -->
                <a href="matsci.html" class="branch-card mat">
                    <span class="branch-name">MATERIAL<br>SCIENCE</span>
                </a>
                
                <!-- Micro Biology -->
                <a href="micro.html" class="branch-card micro">
                    <span class="branch-name">MICRO<br>BIOLOGY</span>
                </a>
                
                <!-- Physics -->
                <a href="physics.html" class="branch-card phy">
                    <span class="branch-name">PHYSICS</span>
                </a>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
