<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SciConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="auth-bg">
    <div class="auth-container">
        <div class="auth-card">
            <!-- Left Side: Branding -->
            <div class="auth-left">
                <div class="auth-brand">
                    <span class="auth-icon"><svg class="sci-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(45 12 12)"></ellipse><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-45 12 12)"></ellipse></svg></span>
                    <h1>Sci<span>Connect</span></h1>
                    <p>"เชื่อมต่อชาววิทย์ ให้ใกล้ชิดกันมากขึ้น"</p>
                </div>
                <a href="home.html" class="back-home">← ย้อนกลับ</a>
            </div>
            
            <!-- Right Side: Form -->
            <div class="auth-right">
                <div class="auth-form-container" id="signupFormContainer">
                    <h2>CREATE NEW<br><span class="highlight-text" style="color: #facc15;">ACCOUNT</span></h2>
                    
                    <form action="pdpa.html" class="auth-form" id="signupForm">
                        <div class="input-group">
                            <label for="username">ชื่อผู้ใช้ (Username)</label>
                            <input type="text" id="username" placeholder="เช่น ขอเกรดเอSE" required>
                        </div>

                        <div class="input-group">
                            <label for="studentid" style="display: flex; justify-content: space-between;">
                                <span>รหัสนิสิต (Student ID)</span>
                                <span style="font-size: 0.75rem; color: rgb(237, 51, 51); font-weight: 400;">*ไม่แสดงให้ผู้ใช้อื่นเห็น</span>
                            </label>
                            <input type="text" id="studentid" placeholder="รหัสนิสิต 11 หลัก" required>
                        </div>

                        <div class="input-group">
                            <label for="email" style="display: flex; justify-content: space-between;">
                                <span>อีเมล (Gmail)</span>
                                <span style="font-size: 0.75rem; color: rgb(237, 51, 51); font-weight: 400;">*ใช้ @g.swu เท่านั้น</span>
                            </label>
                            <input type="email" id="email" placeholder="example@g.swu.ac.th" required>
                        </div>
                        
                        <div class="input-group">
                            <label for="password">รหัสผ่าน (Password)</label>
                            <div class="password-wrapper">
                                <input type="password" id="password" required>
                                <button type="button" class="password-toggle" data-target="password" aria-label="แสดงรหัสผ่าน">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                                </button>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="confirm-password">ยืนยันรหัสผ่าน (Confirm Password)</label>
                            <div class="password-wrapper">
                                <input type="password" id="confirm-password" placeholder="ยืนยันรหัสผ่านอีกครั้ง" required>
                                <button type="button" class="password-toggle" data-target="confirm-password" aria-label="แสดงรหัสผ่าน">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                                </button>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="branch">สาขาวิชา (Major)</label>
                            <select id="branch" class="form-select" required>
                                <option value="" disabled selected>-- เลือกสาขาวิชา --</option>
                                <option value="cs">Computer Science (วิทยาการคอมพิวเตอร์)</option>
                                <option value="math">Math-Stat (คณิตศาสตร์และสถิติ)</option>
                                <option value="bio">Biology (ชีววิทยา)</option>
                                <option value="chem">Chemistry (เคมี)</option>
                                <option value="gen">General Science (วิทยาศาสตร์ทั่วไป)</option>
                                <option value="mat">Material Science (วัสดุศาสตร์)</option>
                                <option value="micro">Microbiology (จุลชีววิทยา)</option>
                                <option value="phy">Physics (ฟิสิกส์)</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label for="gender">เพศ (Gender)</label>
                            <select id="gender" class="form-select" required>
                                <option value="" disabled selected>-- เลือกเพศ --</option>
                                <option value="ชาย">ชาย (Male)</option>
                                <option value="หญิง">หญิง (Female)</option>
                                <option value="อื่นๆ">ไม่ระบุ (Other)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="age">อายุ (Age)</label>
                            <input type="number" id="age" placeholder="ระบุอายุของคุณ" required>
                        </div>

                        <!-- Generation is auto-derived from Student ID -->
                        
                        <div class="auth-actions">
                            <button type="submit" class="auth-btn-signup" style="width: 100%; font-size: 1.1rem; 
                            background: #10b981; color: white; border: none; padding: 0.8rem; border-radius: 0.5rem; 
                            cursor: pointer; font-weight: 600;">REGISTER (Go to PDPA Form)</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
    <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const studentId = document.getElementById('studentid').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const major = document.getElementById('branch').value;
        const gender = document.getElementById('gender').value;
        const age = document.getElementById('age').value;

        if (!studentId || !email || !password || !confirmPassword || !major || !gender || !age) {
            await showAlert('กรุณากรอกฟอร์มให้ครบ', 'error');
            return;
        }

        if (!email.endsWith('@g.swu.ac.th')) {
            await showAlert('ต้องใช้อีเมล @g.swu.ac.th เท่านั้นสำหรับการสมัคร', 'error');
            return;
        }

        if (password !== confirmPassword) {
            await showAlert('รหัสผ่านไม่ตรงกัน', 'error');
            return;
        }

        // เก็บข้อมูลลง localStorage เพื่อไปที่หน้า PDPA
        localStorage.setItem('signupData', JSON.stringify({
            username, studentId, email, password, major, gender, age
        }));

        window.location.href = 'pdpa.html';
    });
    </script>
</body>
</html>
