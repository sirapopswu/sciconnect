<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - SciConnect</title>
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-bg" style="padding: 0; flex-direction: column;">
    <nav class="navbar">
        <div class="nav-container">
            <a href="home.html" class="logo">
                <span class="logo-icon">⚛️</span>
                <span class="logo-text">Sci<span class="logo-highlight">Connect</span></span>
            </a>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="major.html">Major</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
            <div class="nav-action">
                <a href="signin.html" class="btn-signin">Sign in</a>
            </div>
            <button class="mobile-menu-btn" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <main class="main-content" style="padding: 2rem 0; width: 100%; display: flex; justify-content: center; align-items: center; flex: 1;">
        <div class="edit-container" style="max-width: 1000px; width: 95%;">
            <div class="edit-header">
                <h2>ตั้งค่าและแก้ไขโปรไฟล์</h2>
                <p style="color: #64748b; margin-top: 0.5rem; font-size: 1.1rem;">ปรับปรุงข้อมูลของคุณเพื่อรู้จักเพื่อนร่วมคณะได้มากขึ้น</p>
            </div>
            
            <form id="editProfileFormPage" class="edit-form premium-card">
                
                <div class="edit-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
                    <!-- Left Column: Basic Info -->
                    <div class="edit-column">
                        <div class="edit-section">
                            <h3 style="display: flex; align-items: center; gap: 0.5rem;">
                                <span style="font-size: 1.5rem;">👤</span> 
                                ข้อมูลพื้นฐาน (IDENTIFICATION)
                            </h3>
                            <div class="input-group">
                                <label for="display-name">ชื่อ (Full Name)</label>
                                <input type="text" id="display-name" placeholder="ชื่อ-นามสกุล" required>
                            </div>
                            <!-- Generation/Year is auto-derived from name/id -->
                            <div class="input-group">
                                <label for="gender">เพศ (GENDER)</label>
                                <select id="gender" class="form-select">
                                    <option value="ชาย">ชาย (Male)</option>
                                    <option value="หญิง">หญิง (Female)</option>
                                    <option value="อื่นๆ">อื่นๆ (Other)</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="age">อายุ (AGE)</label>
                                <input type="number" id="age" placeholder="ระบุอายุของคุณ">
                            </div>
                            <div class="input-group">
                                <label for="branch">สาขาวิชา (MAJOR)</label>
                                <select id="branch" class="form-select">
                                    <option value="cs">Computer Science (วิทยาการคอมพิวเตอร์)</option>
                                    <option value="math">Math-Stat (คณิตศาสตร์และสถิติ)</option>
                                    <option value="bio">Biology (ชีววิทยา)</option>
                                    <option value="chem">Chemistry (เคมี)</option>
                                    <option value="gen">General Science (วิทยาศาสตร์ทั่วไป)</option>
                                    <option value="mat">Material Science (วัสดุศาสตร์)</option>
                                    <option value="micro">Micro Biology (จุลชีววิทยา)</option>
                                    <option value="phy">Physics (ฟิสิกส์)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Profile Content -->
                    <div class="edit-column">
                        <div class="edit-section">
                            <h3 style="display: flex; align-items: center; gap: 0.5rem;">
                                <span style="font-size: 1.5rem;">✨</span> 
                                โปรไฟล์ (PUBLIC PROFILE)
                            </h3>
                            <div class="input-group">
                                <label for="bio">แนะนำตัวสั้นๆ (BIO)</label>
                                <textarea id="bio" class="form-input" style="height: 120px;" placeholder="เล่าเรื่องราวของคุณสั้นๆ..."></textarea>
                            </div>
                            <div class="input-group">
                                <label for="skills">ทักษะ / ความถนัด (SKILLS) <span style="font-weight: 300; font-size: 0.8rem; color: #94a3b8;">(Comma separated)</span></label>
                                <input type="text" id="skills" placeholder="เช่น Python, UI Design, Lab Skill">
                            </div>
                            <div class="input-group" style="margin-top: 1rem;">
                                <label for="editAvatarInput" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 1rem; border: 2px dashed #e2e8f0; border-radius: 12px; transition: all 0.2s;">
                                    <span style="font-size: 1.5rem;">📸</span>
                                    <span>อัปโหลดรูปโปรไฟล์ (Change Avatar)</span>
                                </label>
                                <input type="file" id="editAvatarInput" accept="image/*" style="display: none;">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form actions -->
                <div class="edit-actions" style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #f1f5f9; display: flex; justify-content: flex-end; gap: 1rem;">
                    <a href="profile.html" class="btn-cancel" style="padding: 0.8rem 2rem; border-radius: 10px; font-weight: 600; text-decoration: none; color: #64748b;">ยกเลิก</a>
                    <button type="submit" class="btn-save" style="padding: 0.8rem 3rem; border-radius: 10px; font-weight: 600; background: #2563eb; color: white; border: none; cursor: pointer; box-shadow: 0 4px 6px -1px rgb(37 99 235 / 20%); transition: all 0.2s;">บันทึกข้อมูลแบบฟอร์ม</button>
                </div>
            </form>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
