<div class="container">
  <div class="row">
    <textarea id="file-source" class="col-md-12">// eslint.config.js
const js = require(&#039;@eslint/js&#039;);

module.exports = [
  {
    ignores: [
      &#039;node_modules/**&#039;,
      &#039;public/**&#039;,
      &#039;coverage/**&#039;,
      &#039;report/**&#039;,
      &#039;cypress/**&#039;,
      &#039;eslint.config.js&#039;,
    ],
  },
  js.configs.recommended,
  {
    files: [&#039;**/*.js&#039;],
    languageOptions: {
      ecmaVersion: 2020,
      sourceType: &#039;commonjs&#039;,
      globals: {
        // Node.js globals
        require: &#039;readonly&#039;,
        module: &#039;writable&#039;,
        exports: &#039;writable&#039;,
        __dirname: &#039;readonly&#039;,
        __filename: &#039;readonly&#039;,
        process: &#039;readonly&#039;,
        console: &#039;readonly&#039;,
        setTimeout: &#039;readonly&#039;,
        clearTimeout: &#039;readonly&#039;,
        setInterval: &#039;readonly&#039;,
        clearInterval: &#039;readonly&#039;,
        // Jest globals
        describe: &#039;readonly&#039;,
        it: &#039;readonly&#039;,
        test: &#039;readonly&#039;,
        expect: &#039;readonly&#039;,
        beforeEach: &#039;readonly&#039;,
        afterEach: &#039;readonly&#039;,
        beforeAll: &#039;readonly&#039;,
        afterAll: &#039;readonly&#039;,
        jest: &#039;readonly&#039;,
      },
    },
    rules: {
      &#039;no-console&#039;: &#039;off&#039;,
      &#039;no-unused-vars&#039;: &#039;warn&#039;,
      &#039;quotes&#039;: [&#039;warn&#039;, &#039;single&#039;],
      &#039;semi&#039;: [&#039;warn&#039;, &#039;always&#039;],
      &#039;eqeqeq&#039;: [&#039;error&#039;, &#039;always&#039;],
      &#039;no-var&#039;: &#039;error&#039;,
      &#039;prefer-const&#039;: &#039;warn&#039;,
    },
  },
];</textarea>
  </div>
</div>
